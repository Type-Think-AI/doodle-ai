# Continuous validation (backlog G3).
#
# WHAT THIS DOES: on every push and pull request, run the checks that were
# previously only ever run by hand — lint, typecheck, the file-size policy
# ratchet, the production build, and the static smoke suite. Nothing here needs
# credentials, so it works identically on forks.
#
# WHAT THIS DELIBERATELY DOES NOT DO: it never deploys and never writes to the
# repo. Deploys are owned by Cloudflare Workers Builds (git-triggered, configured
# in the Cloudflare dashboard) and MUST NOT be duplicated here — a second
# pipeline would race the first. `pnpm check` also runs `wrangler deploy
# --dry-run`; that step is intentionally left out of CI because it needs account
# context and Workers Builds already validates the real deploy.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch: {}

# Read-only: this job inspects the tree and reports status, nothing more.
permissions:
  contents: read

# One run per ref. A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must exist before setup-node so that `cache: pnpm` can find the
      # store. package.json has no `packageManager` field, so the version is
      # pinned here to match local development (pnpm 11.x, pnpm-lock.yaml
      # lockfileVersion 9.0). If a `packageManager` field is ever added, delete
      # this pin so the two cannot disagree.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22' # package.json engines: node >=22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --frozen-lockfile is CI's default, stated explicitly so an out-of-date
      # lockfile fails loudly instead of being silently resolved.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every check below runs even if an earlier one failed, so one red step
      # does not hide the others. The job still fails overall.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit

      # Ratcheted policy check: fails only on NEW violations or on a baselined
      # file that grew. See scripts/check-file-sizes.mjs and
      # docs/file-size-policy-audit.md.
      - name: File-size policy
        if: ${{ !cancelled() }}
        run: pnpm check:sizes

      # No secrets required: every credentialed path in this app runs at request
      # time through Cloudflare bindings, so the bundle builds without them. If a
      # build-time data fetch is ever added, add the real repo secrets and map
      # them into this step's `env:` then — do not guess names in advance.
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # Static smoke suite: parses source to assert skill/mode parity, credit
      # boundaries, webhook signature gates, and API route contracts. Starts no
      # server and touches no production data.
      - name: Smoke
        if: ${{ !cancelled() }}
        run: pnpm smoke
